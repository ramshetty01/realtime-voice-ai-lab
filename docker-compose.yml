services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/voice_lab.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2
      ASR_MODEL: base
      ASR_DEVICE: cpu
      ASR_COMPUTE_TYPE: int8
      ASR_AUDIO_SUFFIX: .webm
      ASR_TIMEOUT_SECONDS: "30"
      LLM_TIMEOUT_SECONDS: "45"
      TTS_TIMEOUT_SECONDS: "30"
      PIPER_BIN: piper
      PIPER_MODEL_PATH: ./models/piper/default.onnx
      AUDIO_PERSISTENCE_ENABLED: "false"
    volumes:
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_VOICE_WS_URL: ws://127.0.0.1:8000/ws/voice
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
